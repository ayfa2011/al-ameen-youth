<div class="section-header">

</div>

<div class="form-group">
  <label>Program Name / ಕಾರ್ಯಕ್ರಮದ ಹೆಸರು:</label>

</div>

<div class="form-group">
  <label>Date / ದಿನಾಂಕ:</label>
  <input type="date" id="progDate" class="form-input">
</div>

<h3>Select Present Members:</h3>
<div id="attendanceList" class="attendance-list">
  <!-- Checkboxes generated dynamically -->
</div>

<button class="btn-submit" onclick="submitAttendance()">Save Attendance</button>
